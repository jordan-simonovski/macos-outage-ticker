name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Mock server self-test
        run: python3 scripts/mock-status-server.py --self-test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build ONN.app and ONN.dmg
        run: scripts/make-app.sh "$GITHUB_REF_NAME"
      - name: Zip the bundle
        # ditto, not zip: preserves bundle structure and the code signature.
        run: ditto -c -k --keepParent dist/ONN.app dist/ONN.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ONN.dmg dist/ONN.zip \
            --title "ONN $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
      - name: Bump the Homebrew cask
        # The cask strips com.apple.quarantine in a postflight, so `brew install`
        # is the one install path that does not trip Gatekeeper. Keep it current.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/ONN.dmg | cut -d' ' -f1)"
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/jordan-simonovski/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"|  version \"$VERSION\"|; s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Casks/onn.rb
          git diff --quiet && { echo "cask already at $VERSION"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "onn $VERSION"
          git push -q
